name: Release

on:
  push:
    branches:
      - main
    paths:
      - "UserScript/**"
      - ".github/scripts/**"
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag and client version (vX.Y.Z, e.g. v1.3.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Job 1: 构建用户脚本并发布到 dist 分支 ───────────────────────────
  # dist 分支同时服务两个地址：
  #   - 用户脚本安装地址 https://raw.githubusercontent.com/cduang/tyybh/dist/user-script.user.js
  #   - Electron preload 的 raw 地址（https://github.com/cduang/tyybh/raw/refs/heads/dist/user-script.user.js，经代理加速）
  userscript:
    name: Build & publish UserScript
    runs-on: ubuntu-latest
    outputs:
      script_version: ${{ steps.version.outputs.script_version }}
      tag: ${{ steps.meta.outputs.tag }}
      app_version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version & tag
        id: version
        run: |
          echo "script_version=$(node -p "require('./UserScript/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: node .github/scripts/release-version.cjs

      - name: Test release version handling
        run: node --test .github/scripts/release-version.test.cjs

      - name: Install dependencies
        working-directory: UserScript
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: UserScript
        run: npm run build

      - name: Publish to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish_dir=$(mktemp -d)
          if git show-ref --verify --quiet refs/remotes/origin/dist; then
            git worktree add -B dist "$publish_dir" origin/dist
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" checkout --orphan dist
            git -C "$publish_dir" rm -rf .
          fi
          cp UserScript/dist/user-script.user.js "$publish_dir/user-script.user.js"
          cd "$publish_dir"
          git add user-script.user.js
          if git diff --cached --quiet; then
            echo "user-script.user.js 无变化，跳过提交"
          else
            git commit -m "chore: publish user-script v${{ steps.version.outputs.script_version }}"
            git push origin dist
          fi

  # ── Job 2: 构建 Electron Windows x64 并上传 Release ────────────────
  electron:
    name: Build Electron & upload Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: userscript
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set client version from release tag
        env:
          RELEASE_TAG: ${{ needs.userscript.outputs.tag }}
        run: node .github/scripts/release-version.cjs --sync-electron

      - name: Install dependencies
        working-directory: ElectronApp
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: ElectronApp
        run: npm run typecheck

      - name: Build installer & portable (x64)
        working-directory: ElectronApp
        run: npm run build:win -- --x64

      - name: Verify artifact versions
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.userscript.outputs.app_version }}
        run: |
          $expected = @(
            "CTYunPCKeepAlive-electron-$env:APP_VERSION-x64-setup.exe",
            "CTYunPCKeepAlive-electron-$env:APP_VERSION-x64-portable.exe"
          )
          $actual = @(Get-ChildItem ElectronApp/dist -Filter *.exe | Select-Object -ExpandProperty Name)
          if (@(Compare-Object $expected $actual).Count -ne 0) {
            throw "Artifact versions do not match release version $env:APP_VERSION. Actual: $($actual -join ', ')"
          }

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.userscript.outputs.tag }}
          files: |
            ElectronApp/dist/*.exe
          fail_on_unmatched_files: true
